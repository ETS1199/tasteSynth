<html>
    <head>
        <title>Playlist View</title>
        <style>
            html {
                background-color: black;
                color: white
            }
        </style>
    </head>
    <body>
        {% for track in tracks %}
        <img src = "{{ track.item.album.images.0.url }}" width="500" height="500">
        <p>{{ track.item.name }}</p>
        {% endfor %}
    </body>
</html>
