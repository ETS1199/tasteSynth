<html>
    <head>
        <title>Playlist View</title>
        <style>
            :root {
                --bg: #121212;
                --surface: #1c1c1e;
                --surface-hover: #262628;
                --text-primary: #f5f5f7;
                --text-secondary: #9a9a9e;
                --accent: #3ecf8e;
            }

            * {
                box-sizing: border-box;
            }

            html, body {
                margin: 0;
                padding: 0;
                background-color: var(--bg);
                color: var(--text-primary);
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
            }

            body {
                padding: 32px 40px 60px;
            }

            .back_link {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                color: var(--text-secondary);
                text-decoration: none;
                font-size: 14px;
                margin-bottom: 24px;
                transition: color 0.2s ease;
            }

            .back_link:hover {
                color: var(--text-primary);
            }

            #track_list {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

            .track_row {
                display: flex;
                align-items: center;
                gap: 16px;
                padding: 8px 10px;
                border-radius: 8px;
                transition: background-color 0.15s ease;
            }

            .track_row:hover {
                background-color: var(--surface-hover);
            }

            .track_row img {
                width: 56px;
                height: 56px;
                object-fit: cover;
                border-radius: 6px;
                flex-shrink: 0;
            }

            .track_index {
                width: 24px;
                text-align: right;
                color: var(--text-secondary);
                font-size: 14px;
                flex-shrink: 0;
            }

            .track_name {
                margin: 0;
                font-size: 15px;
                font-weight: 500;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
        </style>
    </head>
    <body>
        <a class="back_link" href="javascript:history.back()">&larr; Back to playlists</a>
        {% if merged_playlist %}
        <form method="POST" action="{% url 'save_playlist' %}">
            {% csrf_token %}
            <input type="hidden" name="playlist" value="{{ tracks }}">
            <button type="submit">Save Playlist</button>
        </form>
        {% endif %}
        <div id="track_list">
            {% for track in tracks %}
            <div class="track_row">
                <span class="track_index">{{ forloop.counter }}</span>
                <img src="{{ track.item.album.images.0.url }}" alt="{{ track.item.name }}">
                <p class="track_name">{{ track.item.name }}</p>
            </div>
            {% endfor %}
        </div>
    </body>
</html>
